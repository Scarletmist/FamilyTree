<script>

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const person=()=>[...places.flatMap(p=>p.people),...pendingPeople].find(p=>p.id===state.person), home=()=>places.find(p=>p.people.some(p=>p.id===state.person))||{id:'pending-'+state.person,name:'新竹城隍廟',address:'新竹市 · 公開地點',x:.48,y:.42,people:[person()]};

const button=(action,label,name,cls='icon',extra='')=>`<button class="${cls}" data-action="${action}" aria-label="${label}" title="${label}" ${extra}>${icon(name)}</button>`;

function markerPosition(p){const map=$('map'),s=scale();return {x:map.clientWidth*(.5+(p.x-.5)*s)+state.pan.x,y:map.clientHeight*(.5+(p.y-.5)*s)+state.pan.y};}
function focusPlace(id){state.selected=id;state.forceCluster=false;state.zoom=Math.max(15,state.zoom);const p=places.find(p=>p.id===id),s=scale(),m=$('map');state.pan={x:-(p.x-.5)*s*m.clientWidth,y:-(p.y-.5)*s*m.clientHeight-(state.device==='phone'?$('panel').offsetHeight/2:0)};state.popup=null;render();}
function graphics(){const m=$('map');if(!m||!m.clientWidth)return;const s=scale(),r=m.getBoundingClientRect();$('world').setAttribute('transform',`translate(${state.pan.x*1000/r.width} ${state.pan.y*800/r.height}) translate(500 400) scale(${s}) translate(-500 -400)`);let marks='';
 if(state.view!=='edit'||state.mode==='search'){
  if(state.view==='browse'&&state.group&&(state.zoom<15||state.forceCluster)){const p=markerPosition({x:.5,y:.43});marks=`<button class="marker cluster ${state.selected==='cluster'?'selected':''}" data-action="cluster" style="left:${p.x}px;top:${p.y}px" aria-label="此區域 3 位成員，查看所在地與成員" title="新竹天公壇：陳建國、陳淑芬&#10;新竹關帝廟：陳志偉"><span>${places.reduce((n,p)=>n+p.people.length,0)}</span></button>`;}
  else marks=places.map((p,i)=>{const v=markerPosition(p),candidate=state.view==='edit';return `<button class="marker ${state.selected===p.id||candidate&&state.candidate===i?'selected':''} ${candidate?'candidate':''}" data-action="${candidate?'candidate':'marker'}" data-id="${candidate?i:p.id}" style="left:${v.x}px;top:${v.y}px" aria-label="${p.name}，${candidate?'選擇候選地點':p.people.map(p=>p.name).join('、')}"><span>${candidate?i+1:p.people.length>1?p.people.length:'●'}</span></button>`;}).join('');
 }
 $('markers').innerHTML=marks;$('crosshair').hidden=!(state.view==='edit'&&state.mode==='map');$('map').classList.toggle('satellite',state.basemap==='satellite');$('review-status').textContent=`目前縮放 ${state.zoom} · 群組${state.group?'開啟':'關閉'} · 僅預覽`;
}
function render(){const frame=$('frame');frame.className='frame '+(state.device==='desktop'?'':state.device);document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===state.device));$('app-title').textContent=state.view==='edit'?'修正地點':'成員地圖';$('back').hidden=state.view!=='edit';$('counts').hidden=state.view==='edit';$('counts').textContent=`${places.reduce((n,p)=>n+p.people.length,0)} 已定位 · ${pendingPeople.length} 待定位`;$('back').innerHTML=icon('back');$('close').innerHTML=icon('close');
 if(state.device==='phone')$('workarea').style.setProperty('--sheet-height',state.sheet==='collapsed'?'144px':state.sheet==='expanded'?'78%':state.view==='edit'?'55%':'44%');else $('workarea').style.removeProperty('--sheet-height');
 $('map').querySelector('[data-action=layers]').innerHTML=icon('layers');$('map').querySelector('[data-action=layers]').setAttribute('aria-expanded',state.popup==='layers');$('map').querySelector('[data-action=zoom-in]').innerHTML=icon('plus');$('map').querySelector('[data-action=zoom-out]').innerHTML=icon('minus');$('map').querySelector('[data-action=zoom-in]').disabled=state.zoom===19;$('map').querySelector('[data-action=zoom-out]').disabled=state.zoom===2;
 $('crosshair').innerHTML='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3v12 M24 33v12 M3 24h12 M33 24h12 M24 16a8 8 0 1 0 0 16 8 8 0 0 0 0-16" fill="none" stroke="white" stroke-width="6"/><path d="M24 3v12 M24 33v12 M3 24h12 M33 24h12 M24 16a8 8 0 1 0 0 16 8 8 0 0 0 0-16" fill="none" stroke="#ad3f3c" stroke-width="2.5"/><circle cx="24" cy="24" r="3" fill="#ad3f3c" stroke="white" stroke-width="1.5"/></svg>';
 if(state.view==='edit'){
 const p=person(),h=home(),selected=places[state.candidate]||h,m=state.mode==='map';
 $('panel-content').innerHTML=`<div class="panel-head"><h3>${p.name}</h3><p>所在地 · ${h.name}</p></div><div class="panel-scroll"><div class="mode-switch" role="group" aria-label="修正方式">${button('search-mode','搜尋地點','search','icon '+(!m?'selected':''),`aria-pressed="${!m}"`)}${button('pick-mode','在地圖上指定','pick','icon '+(m?'selected':''),`aria-pressed="${m}"`)}</div><p class="mode-caption">${m?'在地圖上指定':'搜尋地點'}</p>${m?'<p class="hint">移動地圖，將地點對準中央準星。</p>':`<form id="search-form"><label for="query" class="muted">補充地名或縣市</label><div class="search-row"><input id="query" class="searchbox" value="${esc(state.query)}" placeholder="輸入地名" required maxlength="120" autocomplete="off"/><button type="submit" class="icon" aria-label="搜尋地點">${icon('search')}</button></div></form><p class="search-status">${state.searched?'找到 2 個候選地點':'按放大鏡搜尋，選擇正確的地點。'}</p>${state.searched?places.map((p,i)=>`<button class="candidate-row" data-action="candidate" data-id="${i}" aria-pressed="${state.candidate===i}"><strong>${p.name}</strong><small>${p.address}</small></button>`).join(''):''}`}
 <div class="selection-card"><small>${m?'目前指定位置':'已選擇'}</small><h3>${m?selected.name+'附近':state.candidate===null?'尚未選擇位置':selected.name}</h3><p>${selected.address}</p></div><label class="apply" ${h.people.length===1?'hidden':''}><input type="checkbox" id="apply" ${state.apply?'checked':''}/>同時套用至相同所在地的其他 ${h.people.length-1} 位成員</label><button class="scope-info" data-action="scope" aria-expanded="${state.scope}">查看影響成員${state.scope?' ▴':' ▾'}</button>${state.scope?`<p class="scope-members">${h.people.map(p=>p.name).join('、')}<br/>其中 ${h.people.filter(p=>p.manual).length} 位已有手動位置，套用後將更新。<br/>每位成員之後仍可個別修正。</p>`:''}</div><footer class="panel-footer">${button('more','更多地點操作','more','icon bare',!p.manual?'disabled':'')}<div class="summary">將套用至 ${affected().length} 位成員<small>儲存後可復原</small></div>${button('save','儲存指定位置','save','icon primary',!m&&state.candidate===null?'disabled':'')}</footer>`;
 }else if(state.view==='pending'){$('panel-content').innerHTML=`<div class="panel-head"><h3>尚未定位</h3><p>${pendingPeople.length} 位成員待處理</p></div><div class="panel-scroll">${pendingPeople.map(p=>`<div class="pending-row"><div>${p.name}<small>${p.reason}</small></div>${button('setup','設定'+p.name+'的所在地','edit','icon',`data-id="${p.id}"`)}</div>`).join('')||'<p class="hint">所有公開所在地皆已定位。</p>'}<details class="private"><summary>1 位成員不在地圖顯示</summary><p>陳秀蓉 · 已設定隱私排除</p></details></div><footer class="panel-footer"><small>公開所在地會依序補齊定位資訊。</small></footer>`;}
 else {$('panel-content').innerHTML=`<div class="panel-head"><h3>${state.selected==='cluster'?'這個區域':'所在地'}</h3><p>${places.length} 個地點 · ${places.reduce((n,p)=>n+p.people.length,0)} 位成員</p></div><div class="panel-scroll"><input id="filter" class="searchbox" aria-label="尋找地點或成員" placeholder="尋找地點或成員"/>${places.map(placeRow).join('')}<button class="option" data-action="pending"><span>尚未定位</span><small>${pendingPeople.length} 位 ›</small></button><details class="private"><summary>1 位成員不在地圖顯示</summary><p>陳秀蓉 · 已設定隱私排除</p></details></div><footer class="panel-footer"><div class="legend"><span class="dot"></span>手動修正位置</div></footer>`;}
 let overlays='';if(state.popup==='layers')overlays=`<div class="popover layers" role="group" aria-label="底圖與顯示設定"><h3>地圖顯示</h3><button class="option" data-action="osm" aria-pressed="${state.basemap==='osm'}"><span>OpenStreetMap 街道圖</span><span class="check">${state.basemap==='osm'?'✓':''}</span></button><button class="option" data-action="satellite" aria-pressed="${state.basemap==='satellite'}"><span>Google 衛星圖</span><span class="check">${state.basemap==='satellite'?'✓':''}</span></button>${state.view!=='edit'?`<hr/><button class="option" data-action="group" aria-pressed="${state.group}"><span>合併鄰近標記</span><span class="check">${state.group?'✓':''}</span></button>`:''}<hr/><div class="legend"><span class="dot"></span>手動修正位置</div></div>`;
 if(state.popup==='cluster')overlays=`<div class="popover cluster-card"><h3>此區域共 ${places.reduce((n,p)=>n+p.people.length,0)} 位成員</h3><small>${places.length} 個所在地</small>${places.map(p=>`<h3 class="cluster-location">${p.name}</h3>${p.people.map(member=>`<button class="option" data-action="place" data-id="${p.id}"><span>${member.name}</span><span>›</span></button>`).join('')}`).join('')}</div>`;
 if(state.popup==='person')overlays=`<div class="popover person-card">${button('dismiss','關閉成員摘要','close','icon bare')}<h3>${person().name}</h3><p>${home().name}</p><p>${person().manual?'● 手動修正位置':'自動定位'}</p><button class="option" data-action="edit" data-id="${person().id}"><span>修正位置</span><span>›</span></button></div>`;
 if(state.failure)overlays+=`<div class="tile-alert" role="status"><span>衛星底圖暫時無法載入</span><button data-action="osm">切回街道圖</button></div>`;
 $('map-overlays').innerHTML=state.popup==='layers'?'':overlays;$('floating').innerHTML=(state.popup==='layers'?overlays:'')+(state.popup==='more'?`<div class="popover more-menu"><h3>地點操作</h3><button class="option" data-action="restore"><span>恢復此成員的自動定位</span>${icon('restore')}</button><button class="option" data-action="dismiss">取消</button></div>`:'')+(state.toast?`<div class="toast" role="status"><span>${state.toast}</span>${state.undo?'<button data-action="undo">復原</button>':'<button data-action="dismiss-toast" aria-label="關閉提示">×</button>'}</div>`:'');
 $('attribution').textContent=state.basemap==='osm'?'OpenStreetMap 底圖示意':'Google 衛星底圖示意';requestAnimationFrame(graphics);
}
function startEdit(id='a'){state.person=id;state.view='edit';state.mode=pendingPeople.some(p=>p.id===id)?'search':'map';state.popup=null;state.sheet='medium';state.searched=false;state.query=home().name;state.candidate=pendingPeople.some(p=>p.id===id)?null:Math.max(0,places.indexOf(home()));state.apply=true;state.scope=false;render();}
function action(a,id){
 if(a==='layers'||a==='more'){state.popup=state.popup===a?null:a;render();return;}
 if(a==='zoom-in'||a==='zoom-out'){state.zoom=Math.max(2,Math.min(19,state.zoom+(a==='zoom-in'?1:-1)));state.popup=null;render();return;}
 if(a==='osm'||a==='satellite'){state.basemap=a;state.failure=false;render();return;}
 if(a==='group'){state.group=!state.group;render();return;}
 if(a==='marker'||a==='place'){state.view='browse';state.sheet='medium';focusPlace(id);return;}
 if(a==='cluster'){state.selected='cluster';state.popup='cluster';state.sheet='medium';render();return;}
 if(a==='person'){state.person=id;state.popup='person';render();return;}
 if(a==='edit'||a==='setup'){startEdit(id||'a');return;}
 if(a==='pending'){state.view=state.view==='pending'?'browse':'pending';state.popup=null;state.sheet='medium';render();return;}
 if(a==='pick-mode'||a==='search-mode'){const input=$('query');if(input)state.query=input.value;state.mode=a==='pick-mode'?'map':'search';state.popup=null;render();return;}
 if(a==='candidate'){state.candidate=Number(id);state.zoom=Math.max(15,state.zoom);state.selected=places[state.candidate].id;state.pan={x:0,y:0};render();return;}
 if(a==='scope'){state.scope=!state.scope;render();return;}
 if(a==='save'||a==='restore'){state.undo=structuredClone({places,pendingPeople});if(a==='restore')person().manual=false;else affected().forEach(p=>p.manual=true);if(pendingPeople.some(p=>p.id===state.person)&&a==='save'){places.push(home());pendingPeople.splice(pendingPeople.findIndex(p=>p.id===state.person),1);}state.toast=a==='restore'?'已恢復自動定位':`已更新 ${affected().length} 位成員的位置`;state.view='browse';state.selected=home().id;state.popup=null;state.sheet='medium';render();return;}
 if(a==='undo'){places.splice(0,places.length,...state.undo.places);pendingPeople.splice(0,pendingPeople.length,...state.undo.pendingPeople);state.undo=null;state.toast='已復原位置修改';render();return;}
 if(a==='dismiss'){state.popup=null;render();return;}if(a==='dismiss-toast'){state.toast=null;render();return;}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.device){state.device=b.dataset.device;state.popup=null;render();return;}if(b.dataset.scenario){state.forceCluster=false;state.popup=null;state.failure=false;state.pan={x:0,y:0};state.sheet='medium';if(b.dataset.scenario==='edit'){startEdit();return;}state.view=b.dataset.scenario==='pending'?'pending':'browse';if(b.dataset.scenario==='max'){state.zoom=19;state.group=true;state.forceCluster=true;state.selected='cluster';state.popup='cluster';}else{state.zoom=15;state.selected='temple';}if(b.dataset.scenario==='failure'){state.basemap='satellite';state.failure=true;}render();return;}if(b.dataset.action)action(b.dataset.action,b.dataset.id);});
document.addEventListener('change',e=>{if(e.target.id==='apply'){state.apply=e.target.checked;render();}});
document.addEventListener('input',e=>{if(e.target.id==='query')state.query=e.target.value;if(e.target.id==='filter'){const q=e.target.value.trim();document.querySelectorAll('.place').forEach(el=>el.hidden=!el.textContent.includes(q));}});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();state.query=$('query').value;state.searched=true;state.candidate=null;render();}});
$('counts').onclick=()=>action('pending');$('back').onclick=()=>{state.view='browse';state.popup=null;state.selected=home().id;render();};$('close').onclick=()=>{document.querySelector('.app-header').hidden=true;$('workarea').hidden=true;$('frame').insertAdjacentHTML('beforeend','<div class="closed"><h2>成員地圖已關閉</h2><p class="muted">預覽不會修改正式資料</p><button onclick="location.reload()">重新開啟預覽</button></div>');};
let drag=null;
$('map').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input,.popover'))return;state.popup=null;$('map-overlays').innerHTML='';drag={kind:'map',x:e.clientX,y:e.clientY,pan:{...state.pan}};e.currentTarget.setPointerCapture(e.pointerId);});
$('handle').addEventListener('pointerdown',e=>{drag={kind:'sheet',y:e.clientY,height:$('panel').offsetHeight,moved:false};e.currentTarget.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.kind==='map'){state.pan={x:drag.pan.x+e.clientX-drag.x,y:drag.pan.y+e.clientY-drag.y};graphics();}else{const h=Math.max(144,Math.min($('workarea').clientHeight*.82,drag.height+drag.y-e.clientY));drag.moved=Math.abs(drag.y-e.clientY)>5;$('workarea').style.setProperty('--sheet-height',h+'px');}});
document.addEventListener('pointerup',()=>{if(drag?.kind==='sheet'){if(!drag.moved)state.sheet=state.sheet==='collapsed'?'medium':state.sheet==='medium'?'expanded':'collapsed';else{const ratio=$('panel').offsetHeight/$('workarea').clientHeight;state.sheet=ratio>.62?'expanded':ratio<.29?'collapsed':'medium';}render();}drag=null;});document.addEventListener('pointercancel',()=>{drag=null;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.popup){state.popup=null;render();}else if(state.view==='edit')$('back').click();return;}if(e.target.id==='map'){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();state.pan.x+=e.key==='ArrowLeft'?24:e.key==='ArrowRight'?-24:0;state.pan.y+=e.key==='ArrowUp'?24:e.key==='ArrowDown'?-24:0;graphics();}if(['+','=','-'].includes(e.key)){e.preventDefault();action(e.key==='-'?'zoom-out':'zoom-in');}}});
window.addEventListener('resize',graphics);render();
</script>
</html>
