<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-oauth-client-id" content="" />
  <title>族譜圖 — 陳氏家族</title>
  <link rel="stylesheet" href="assets/family-tree.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-header__inner">
      <div class="page-header__identity">
        <h1 class="page-header__title" id="family-title">陳氏家族族譜圖</h1>
        <button type="button" id="edit-family-name" class="details-icon" aria-label="編輯家族名稱" title="編輯家族名稱" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4L16.5 3.5z" /></svg>
        </button>
      </div>
      <div class="tree-controls">
        <label for="family-filter" class="family-filter-label">顯示範圍</label>
        <select id="family-filter" aria-label="顯示範圍"><option value="">所有關係</option></select>
        <button type="button" id="show-member-list" class="plain-button mobile-icon-control" aria-label="所有成員" title="所有成員">
          <span class="tree-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg></span>
          <span class="tree-control-text">所有成員</span><span class="tree-control-short" aria-hidden="true">成員</span>
        </button>
        <button type="button" id="add-member" class="primary-button mobile-icon-control" aria-label="新增成員" title="新增成員" disabled>
          <span class="tree-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3.5 19c.6-4 2.5-6 5.5-6s4.9 2 5.5 6"/><path d="M18 13v6M15 16h6"/></svg></span>
          <span class="tree-control-text">＋ 新增成員</span><span class="tree-control-short" aria-hidden="true">新增</span>
        </button>
        <button type="button" id="import-json" class="plain-button mobile-icon-control" aria-label="匯入族譜" title="匯入族譜" disabled>
          <span class="tree-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 18v2h14v-2"/></svg></span>
          <span class="tree-control-text">匯入</span>
        </button>
        <button type="button" id="export-json" class="plain-button mobile-icon-control" aria-label="匯出族譜" title="匯出族譜" disabled>
          <span class="tree-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M5 18v2h14v-2"/></svg></span>
          <span class="tree-control-text">匯出</span>
        </button>
        <button type="button" id="cloud-sync" class="plain-button mobile-icon-control cloud-sync-button" aria-label="連結 Google Drive 以跨裝置同步" title="連結 Google Drive 以跨裝置同步" data-sync-state="disconnected">
          <span class="tree-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 18.5h9.2a4.3 4.3 0 0 0 .7-8.5A6 6 0 0 0 6 8.6a4.8 4.8 0 0 0 1.5 9.9Z"/><path d="M12 10v6m-2-2 2 2 2-2"/></svg></span>
          <span class="tree-control-text" id="cloud-sync-button-text">雲端</span>
        </button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </div>
    </div>
  </header>
  <form id="relationship-search" class="relationship-search" aria-label="查詢兩人成員關係">
    <label><select id="relationship-a" required aria-label="成員 A"><option value="">請選擇成員</option></select></label>
    <button type="button" id="relationship-swap" class="plain-button" aria-label="交換兩人成員" title="交換兩人成員"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4" /></svg></button>
    <label><select id="relationship-b" required aria-label="成員 B"><option value="">請選擇成員</option></select></label>
    <button type="submit" class="primary-button" disabled>查詢兩人關係</button>
    <span class="canvas-display-controls">
      <button type="button" id="relationship-reset" class="plain-button">顯示全部</button>
      <button type="button" id="toggle-canvas-names" class="plain-button mosaic-button" aria-label="隱藏畫布姓名" title="隱藏畫布姓名" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M2 2h6v6H2zM16 2h6v6h-6zM9 9h6v6H9zM2 16h6v6H2zM16 16h6v6h-6z" />
          <path opacity=".35" d="M9 2h6v6H9zM2 9h6v6H2zM16 9h6v6h-6zM9 16h6v6H9z" />
        </svg>
      </button>
    </span>
    <div id="kinship-feedback" class="relationship-search-feedback" hidden>
      <span id="kinship-status" role="status" aria-live="polite"></span>
      <button type="button" id="kinship-retry" class="plain-button" hidden>重試載入設定</button>
    </div>
  </form>
  <details class="legend-panel">
    <summary>關係圖例 · 捲軸／按住拖曳移動畫布 · Ctrl/⌘＋滾輪／觸控板縮放 · 點選人物查看關係</summary>
    <div class="legend" id="relationship-legend"></div>
  </details>
  <div class="workspace">
    <section id="relationship-summary" class="relationship-summary" aria-live="polite" aria-label="兩人關係結果" hidden></section>
    <main class="tree" tabindex="0" aria-label="族譜關係圖，可用捲軸、方向鍵或按住拖曳移動；觸控裝置可雙指縮放">
      <div class="tree__canvas" id="tree-canvas"></div>
      <div class="tree__zoom-spacer" id="tree-zoom-spacer" aria-hidden="true"></div>
    </main>
    <div class="tree-zoom-controls" id="tree-zoom-controls" role="group" aria-label="族譜縮放控制">
      <button type="button" id="tree-zoom-out" aria-label="縮小族譜" title="縮小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" id="tree-zoom-value" aria-label="重設族譜縮放為 100%" title="重設為 100%">100%</button>
      <button type="button" id="tree-zoom-in" aria-label="放大族譜" title="放大">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" id="tree-zoom-fit" aria-label="讓族譜適應畫布寬度" title="適應畫布寬度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7H4v4M16 7h4v4M8 17H4v-4M16 17h4v-4"/><path d="m4 7 5 5-5 5M20 7l-5 5 5 5" opacity=".45"/></svg>
        <span>適應寬度</span>
      </button>
    </div>
    <button type="button" id="mobile-tree-fit" class="mobile-tree-fit" aria-label="讓族譜適應目前畫面" title="適應畫面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/><path d="M4 8 9 13M20 8l-5 5M4 16l5-5M20 16l-5-5" opacity=".45"/></svg>
    </button>
    <div id="tree-semantic-zoom-hud" class="tree-semantic-zoom-hud" aria-hidden="true">100% · 完整</div>
    <div id="cloud-auth-toast" class="cloud-auth-toast" role="status" aria-live="polite" aria-atomic="true" data-auth-state="waiting" hidden>
      <span class="cloud-auth-toast__indicator" aria-hidden="true"></span>
      <span id="cloud-auth-toast-text">Google Drive 雲端連線狀態更新中…</span>
    </div>
    <button type="button" id="cloud-sync-alert" class="cloud-sync-alert" data-sync-state="pending" aria-label="開啟 Google Drive 同步" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 18.5h9.2a4.3 4.3 0 0 0 .7-8.5A6 6 0 0 0 6 8.6a4.8 4.8 0 0 0 1.5 9.9Z"/><path d="M12 8v5m0 3h.01"/></svg>
      <span id="cloud-sync-alert-text" class="cloud-sync-alert__text">雲端有未同步變更</span><span class="cloud-sync-alert__action">處理</span>
    </button>
    <section class="relationship-details" id="relationship-details" aria-label="成員關係詳情" hidden></section>
    <div id="member-tooltip" class="member-tooltip" role="tooltip" hidden>
      <div class="member-tooltip__header"><span class="member-tooltip__label">成員備註</span><span id="member-tooltip-name"></span></div>
      <div class="member-tooltip__body" id="member-tooltip-body"></div>
    </div>
    <p id="save-status" class="save-status" role="status"></p>
    <p id="backup-status" role="status" style="position:absolute;bottom:0;left:16px;z-index:4;margin:0;font-size:12px;background:white;max-width:calc(100% - 32px)"></p>
  </div>
  <!-- @include templates/dialogs.html -->
  <script src="assets/family-model.js"></script>
  <script src="assets/family-display-projection.js"></script>
  <script src="assets/family-commands.js"></script>
  <script src="assets/relationship-details.js"></script>
  <script src="assets/generation-bands.js"></script>
  <script src="assets/kinship.js"></script>
  <script src="assets/relationship-search.js"></script>
  <script src="assets/connector-routing.js"></script>
  <script src="assets/label-layout.js"></script>
  <script src="assets/family-storage.js"></script>
  <script src="assets/family-repository.js"></script>
  <script src="assets/family-app.js"></script>
  <script src="assets/member-form.js"></script>
  <script src="assets/family-management.js"></script>
  <script src="assets/google-drive-client.js"></script>
  <script src="assets/family-sync-engine.js"></script>
  <script src="assets/google-drive-sync.js"></script>
  <script src="assets/member-tools.js"></script>
  <script src="assets/mobile-gesture-policy.js"></script>
  <script src="assets/mobile-landscape-toolbar.js"></script>
  <script type="module" src="assets/family-tree.js"></script>
</body>
</html>
