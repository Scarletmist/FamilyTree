<style>

<div class="presentation" id="presentation">
<div class="intro"><div><h1>族譜工作空間</h1><p>設計方向：暖白、清楚的層級、以畫布為中心 · 使用示例資料的獨立原型</p></div><div class="mode" role="group" aria-label="版面示意"><button id="desktop" aria-pressed="true">桌面</button><button id="mobile" aria-pressed="false">手機</button></div></div>
<div class="shell">
<header class="header"><div class="identity"><strong>陳氏家族</strong><small>族譜關係圖</small></div><button class="text members" data-demo="成員清單保留搜尋、篩選、最近查看、排行群組、合併與復原入口。">所有成員</button><span class="sync">◌ 雲端未連結</span><button class="accent" data-demo="新增成員延續原本表單、關係驗證與草稿流程。">新增成員</button><button aria-label="更多操作" data-demo="更多：匯入、匯出、Google Drive、編輯家族名稱、姓名顯示、已忽略待補項目。">更多</button></header>
<div class="toolbar"><label for="scope">顯示範圍</label><select id="scope"><option>所有關係</option><option>陳阿土 ＋ 林氏</option></select><button id="query">⇄ 查詢兩人關係</button><button id="reset" class="text">顯示全部</button><span class="spacer"></span><button class="text" id="legend-button" aria-expanded="false">圖例</button></div>
<div class="result" id="result" hidden><strong>陳文彬是陳阿土的兒子</strong><button id="swap">交換</button><button data-demo="正式版保留完整關係路徑、替代路徑、待確認與來源。">路徑</button></div>
<div class="main"><div class="canvas"><div class="drawing">
<div class="band one"><span class="gen">第 2 代</span></div><div class="band two"><span class="gen">第 3 代</span></div><div class="band three"><span class="gen">第 4 代</span></div>
<svg class="lines" viewBox="0 0 780 650" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#347045"/></marker></defs><path d="M295 107H365 M295 111H365" fill="none" stroke="#aa3d55" stroke-width="2"/><path d="M330 112V239H160V295 M330 239H610V295 M385 239V295" fill="none" stroke="#59616c" stroke-width="2"/><circle cx="330" cy="239" r="3" fill="#59616c"/><path d="M385 383V523" fill="none" stroke="#347045" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="101" font-size="12" fill="#aa3d55">婚姻</text><text x="398" y="454" font-size="12" fill="#347045">親生</text></svg>
<button class="node a" data-name="陳阿土" aria-pressed="true"><b>陳阿土</b><small>第 2 代</small></button><button class="node b" data-name="林氏" aria-pressed="false"><b>林氏</b><small>第 2 代</small></button><button class="node c" data-name="陳秀琴" aria-pressed="false"><b>陳秀琴</b><small>手足次序 2</small></button><button class="node d" data-name="陳文彬" aria-pressed="false"><b>陳文彬</b><small>手足次序 1</small></button><button class="node e" data-name="陳文德" aria-pressed="false"><b>陳文德</b><small>手足次序 3</small></button><button class="node f" data-name="陳建國" aria-pressed="false"><b>陳建國</b><small>第 4 代</small></button>
</div><div class="zoom"><button data-demo="正式版沿用原有縮放與滑鼠錨點。" aria-label="縮小">−</button><span>100% · 完整</span><button data-demo="正式版保留 semantic zoom 級距。" aria-label="放大">＋</button><button data-demo="正式版依畫布可用範圍計算，不會被詳情區遮住。">適應畫面</button></div><div class="legend" id="legend" hidden><strong>關係圖例</strong><br><span style="color:#aa3d55">═</span> 婚姻 · 雙線<br><span style="color:#347045">⟶</span> 親生 · 實線箭頭<br>完整圖例保留所有既有關係類型</div></div>
<aside class="inspector" id="inspector" aria-label="成員詳情"><div class="top">成員詳情<button id="collapse" aria-label="收合詳情">›</button></div><h2 id="person-name">陳阿土</h2><div class="meta" id="person-meta">第 2 代 · 關係詳情</div><div class="actions"><button data-demo="沿用既有編輯流程。">編輯</button><button class="accent" data-demo="沿用既有新增親屬方向與預填關係。">＋ 新增親屬</button></div><div class="secondary"><button id="detail-query">查關係</button><button data-demo="正式版定位保留選取與焦點。">定位</button><button id="close">關閉</button></div><div id="groups"></div><p class="notice">直接設定、推導依據、待確認及來源資訊，仍保留在關係詳情中。</p></aside></div>
</div><p class="footnote" id="feedback" role="status">可切換桌面／手機、點選人物、切換查詢模式、展開圖例。此頁只示範版面，不修改資料。手機點姓名可展開詳情。</p>
</div>
<script>
const root=document.getElementById('presentation'), panel=document.getElementById('inspector'), title=document.getElementById('person-name'), meta=document.getElementById('person-meta'), groups=document.getElementById('groups'), feedback=document.getElementById('feedback');
const profiles={陳阿土:['第 2 代',[['配偶',[['林氏','直接設定']]],['子女',[['陳文彬','親生 · 手足次序 1'],['陳秀琴','親生 · 手足次序 2'],['陳文德','親生 · 手足次序 3']]]]],林氏:['第 2 代',[['配偶',[['陳阿土','直接設定']]],['子女',[['陳文彬','親生'],['陳秀琴','親生'],['陳文德','親生']]]]],陳文彬:['第 3 代',[['父母',[['陳阿土','父親 · 直接設定'],['林氏','母親 · 直接設定']]],['子女',[['陳建國','親生']]]]],陳秀琴:['第 3 代',[['父母',[['陳阿土','父親'],['林氏','母親']]]]],陳文德:['第 3 代',[['父母',[['陳阿土','父親'],['林氏','母親']]]]],陳建國:['第 4 代',[['父母',[['陳文彬','父親 · 直接設定']]]]]};
function select(name){title.textContent=name;meta.textContent=profiles[name][0]+' · 關係詳情';groups.replaceChildren();profiles[name][1].forEach(([label,rows],i)=>{const d=document.createElement('details');d.className='group';d.open=i===0;const s=document.createElement('summary');s.textContent=label;const count=document.createElement('span');count.textContent=rows.length;s.append(count);d.append(s);rows.forEach(([n,note])=>{const row=document.createElement('div');row.className='row';const b=document.createElement('div');b.textContent=n;const small=document.createElement('small');small.textContent=note;b.append(small);row.append(b);d.append(row)});groups.append(d)});panel.hidden=false;panel.classList.toggle('peek',root.classList.contains('mobile'));document.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed',n.dataset.name===name));}
document.querySelectorAll('.node').forEach(n=>n.onclick=()=>select(n.dataset.name));
for(const id of ['desktop','mobile'])document.getElementById(id).onclick=()=>{root.classList.toggle('mobile',id==='mobile');panel.classList.toggle('peek',id==='mobile');for(const x of ['desktop','mobile'])document.getElementById(x).setAttribute('aria-pressed',x===id)};
title.onclick=()=>{if(root.classList.contains('mobile'))panel.classList.toggle('peek')};document.getElementById('close').onclick=()=>{panel.hidden=true;document.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed','false'))};document.getElementById('collapse').onclick=()=>{panel.hidden=true;feedback.textContent='詳情已收合；點選人物可重新展開。正式版會保留選取與收合標籤。'};
const result=document.getElementById('result');document.getElementById('query').onclick=document.getElementById('detail-query').onclick=()=>{result.hidden=false;feedback.textContent='示例查詢模式：正式版保留選人、交換、完整路徑與原視角還原。'};document.getElementById('reset').onclick=()=>{result.hidden=true;feedback.textContent='回到全圖示意；正式版還原查詢前的原視角。'};document.getElementById('swap').onclick=()=>{const s=result.querySelector('strong');s.textContent=s.textContent.includes('兒子')?'陳阿土是陳文彬的父親':'陳文彬是陳阿土的兒子'};
document.getElementById('legend-button').onclick=()=>{const l=document.getElementById('legend');l.hidden=!l.hidden;document.getElementById('legend-button').setAttribute('aria-expanded',!l.hidden)};document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>feedback.textContent=b.dataset.demo+'（設計示意，不執行資料操作）');document.getElementById('scope').onchange=()=>feedback.textContent='正式版沿用既有家族範圍篩選；示意圖不重排關係。';select('陳阿土');
</script></html>
